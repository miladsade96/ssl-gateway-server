spring:
  application:
    name: ssl-gateway-server

server:
  port: 8090
  ssl:
    enabled: true
    # Server's certificate (for incoming connections)
    key-store: classpath:gateway-keystore.jks
    key-store-password: gateway-pass
    key-store-type: JKS
    key-alias: gateway-server

    # Require client certificate authentication (mTLS)
    client-auth: need

    # Trust only certificates signed by our CA
    trust-store: classpath:gateway-truststore.jks
    trust-store-password: truststore-pass
    trust-store-type: JKS

logging:
  level:
    org.springframework.security: DEBUG
    javax.net.ssl: DEBUG
